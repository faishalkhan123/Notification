<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: black;
            color: #00FF00;
            font-family: monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .overlay {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border: 1px solid #00FF00;
            box-shadow: 0 0 15px #00FF00;
            border-radius: 8px;
            width: 300px;
        }
        h1 { margin-bottom: 15px; font-size: 18px; text-shadow: 0 0 5px #00FF00; }
        p { font-size: 13px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="overlay">
        <h1>NOTIFICATION TESTING...</h1>
        <p id="status">Status: Initializing System...</p>
        <p id="count">Notifications Sent: 0 / 5</p>
    </div>

    <script>
        // Matrix Background Animation
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array.from({ length: columns }).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00FF00";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Notification Logic
        let count = 0;
        const maxNotifications = 5;
        const statusElem = document.getElementById('status');
        const countElem = document.getElementById('count');

        // Inline Service Worker Code Creation
        const swCode = `
            self.addEventListener('notificationclick', function(event) {
                event.notification.close();
                event.waitUntil(clients.openWindow('/'));
            });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);

        async function initNotifications() {
            if (!('Notification' in window) || !('serviceWorker' in navigator)) {
                statusElem.innerText = "Status: Browser not supported.";
                return;
            }

            try {
                // Register Service Worker from Blob URL
                const registration = await navigator.serviceWorker.register(swUrl);

                // Request Permission
                const permission = await Notification.requestPermission();

                if (permission === 'granted') {
                    statusElem.innerText = "Status: Permission Granted!";

                    // First Immediate Notification
                    sendNotification(registration, "Testing Started", "Immediate test notification received.");

                    // Notification every 1 minute (60,000 ms)
                    const interval = setInterval(() => {
                        if (count < maxNotifications) {
                            sendNotification(registration, `System Alert #${count}`, "Background notification active...");
                        } else {
                            clearInterval(interval);
                            statusElem.innerText = "Status: Complete (5/5 Sent).";
                        }
                    }, 60000);

                } else {
                    statusElem.innerText = "Status: Permission Denied.";
                }
            } catch (err) {
                statusElem.innerText = "Error: " + err.message;
            }
        }

        function sendNotification(registration, title, body) {
            count++;
            countElem.innerText = `Notifications Sent: ${count} / 5`;

            registration.showNotification(title, {
                body: body,
                vibrate: [200, 100, 200]
            });
        }

        window.onload = initNotifications;
    </script>
</body>
</html>
