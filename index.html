<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapid Notification Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        .box {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 1px solid #0f0;
            box-shadow: 0 0 10px #0f0;
            border-radius: 8px;
            text-align: center;
            width: 300px;
        }
        h2 { font-size: 16px; margin-bottom: 10px; text-shadow: 0 0 5px #0f0; }
        p { font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="box">
        <h2>RAPID TEST ACTIVE</h2>
        <p id="status">Status: Initializing...</p>
        <p id="counter">Notifications Sent: 0</p>
    </div>

    <script>
        // Matrix Background Effect
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ@#$%^&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array.from({ length: columns }).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Rapid Notification Engine
        let count = 0;
        const statusElem = document.getElementById('status');
        const countElem = document.getElementById('counter');

        async function startRapidNotifications() {
            if (!('Notification' in window) || !('serviceWorker' in navigator)) {
                statusElem.innerText = "Status: Not Supported";
                return;
            }

            try {
                // Register inline Service Worker via Data URL (Avoids duplicate file)
                const swCode = `
                    self.addEventListener('notificationclick', e => {
                        e.notification.close();
                        e.waitUntil(clients.openWindow('/'));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const registration = await navigator.serviceWorker.register(URL.createObjectURL(blob));

                // Request Permission
                const permission = await Notification.requestPermission();

                if (permission === 'granted') {
                    statusElem.innerText = "Status: Sending Every 1 Second...";

                    // Send 1 Notification every 1000ms (1 second)
                    setInterval(() => {
                        count++;
                        countElem.innerText = `Notifications Sent: ${count}`;
                        
                        // Tag handles overwriting so drawer doesn't get clogged endlessly
                        registration.showNotification(`Alert #${count}`, {
                            body: `Rapid Test Message ${count}`,
                            tag: 'rapid-test',
                            renotify: true
                        });
                    }, 1000);

                } else {
                    statusElem.innerText = "Status: Permission Denied.";
                }
            } catch (err) {
                statusElem.innerText = "Error: " + err.message;
            }
        }

        window.onload = startRapidNotifications;
    </script>
</body>
</html>
